<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Caro Online 2 Người Chơi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 20px; }
        h1 { color: #1877f2; }
        #status { font-size: 1.2rem; margin: 10px; font-weight: bold; color: #555; }
        #board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 5px; justify-content: center; margin: 20px auto; }
        .cell { width: 100px; height: 100px; background-color: #fff; border: 2px solid #ccd0d5; font-size: 2.5rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .cell:hover { background-color: #e4e6eb; }
        .cell.X { color: #1877f2; }
        .cell.O { color: #e41e3f; }
        button { padding: 10px 20px; font-size: 1rem; background-color: #00a400; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #008c00; }
    </style>
</head>
<body>

    <h1>CỜ CARO ONLINE</h1>
    <div id="status">Đang kết nối tới máy chủ...</div>
    <div id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>
    <button onclick="resetGame()">Chơi Lại Ngay</button>

    <!-- Tải thư viện kết nối Server của Google -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // Cấu hình máy chủ kết nối trung gian miễn phí công cộng
        const firebaseConfig = {
            databaseURL: "https://firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("caro_game");

        let role = ""; 
        let currentTurn = "X";
        let boardState = ["", "", "", "", "", "", "", "", ""];

        // Lắng nghe dữ liệu thay đổi từ người chơi khác truyền lên Server
        db.on("value", (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            
            boardState = data.board || ["", "", "", "", "", "", "", "", ""];
            currentTurn = data.turn || "X";
            
            updateUI();
            checkWinner();
        });

        function updateUI() {
            const cells = document.querySelectorAll(".cell");
            cells.forEach((cell, index) => {
                cell.innerText = boardState[index];
                cell.className = `cell ${boardState[index]}`;
            });
            document.getElementById("status").innerText = `Lượt đi tiếp theo: Người chơi ${currentTurn}`;
        }

        function makeMove(index) {
            if (boardState[index] === "") {
                boardState[index] = currentTurn;
                let nextTurn = currentTurn === "X" ? "O" : "X";
                
                // Gửi vị trí vừa đánh lên Server để máy bạn kia đồng bộ theo
                db.set({ board: boardState, turn: nextTurn });
            }
        }

        function checkWinner() {
            const winPatterns = [, [3,4,5], [6,7,8],
, [1,4,7], [2,5,8],
, [2,4,6]
            ];
            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    document.getElementById("status").innerText = `Chúc mừng! Người chơi ${boardState[a]} đã CHIẾN THẮNG 🎉`;
                    return;
                }
            }
            if (!boardState.includes("")) {
                document.getElementById("status").innerText = "Trận đấu HÒA RỒI! 🤝";
            }
        }

        function resetGame() {
            db.set({ board: ["", "", "", "", "", "", "", "", ""], turn: "X" });
        }
    </script>
</body>
</html>
